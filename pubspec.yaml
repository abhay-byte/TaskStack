name: taskstack
description: "TaskStack — Advanced 24-hour daily task management and life analytics app"
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^17.1.0

  # ── Local Database (SQLite via Drift ORM) ─────────────────────────────────
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_timezone: ^3.0.0

  # ── Charts (Analytics) ────────────────────────────────────────────────────
  fl_chart: ^1.1.1

  # ── Typography (Google Fonts) ─────────────────────────────────────────────
  google_fonts: ^8.0.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  shared_preferences: ^2.3.3

  # ── JSON Serialisation ────────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── UI Utilities ──────────────────────────────────────────────────────────
  smooth_page_indicator: ^2.0.1
  gap: ^3.0.1
  file_picker: ^10.3.10

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  webview_flutter: ^4.13.1

  # ── Cloud / Firebase ─────────────────────────────────────────────────────
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.5
  firebase_database: ^11.3.4
  google_sign_in: ^6.2.2

  # ── QR Code ───────────────────────────────────────────────────────────────
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  riverpod_generator: ^4.0.0+1
  json_serializable: ^6.9.3
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/

dependency_overrides:
  fl_chart:
    git:
      url: https://github.com/imaNNeo/fl_chart.git
      ref: main
