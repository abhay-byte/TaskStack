name: taskstack
description: "TaskStack — Advanced 24-hour daily task management and life analytics app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^15.1.1

  # ── Local Database (SQLite via Drift ORM) ─────────────────────────────────
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.1

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # ── Charts (Analytics) ────────────────────────────────────────────────────
  fl_chart: ^1.1.1

  # ── Typography (Google Fonts) ─────────────────────────────────────────────
  google_fonts: ^8.0.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.5.1
  intl: ^0.20.2
  equatable: ^2.0.7
  shared_preferences: ^2.3.3

  # ── JSON Serialisation ────────────────────────────────────────────────────
  json_annotation: ^4.9.0

  # ── UI Utilities ──────────────────────────────────────────────────────────
  smooth_page_indicator: ^1.2.0+3
  gap: ^3.0.1
  file_picker: ^8.1.7

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.14
  drift_dev: ^2.23.1
  riverpod_generator: ^2.6.2
  json_serializable: ^6.9.3
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/
