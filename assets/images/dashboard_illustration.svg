<svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes float1 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        @keyframes float3 {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }
        
        .card-1 { animation: float1 6s ease-in-out infinite; transform-origin: center; }
        .card-2 { animation: float2 7s ease-in-out infinite reverse; transform-origin: center; }
        .card-3 { animation: float3 5s ease-in-out infinite 1s; transform-origin: center; }
        .blob-1 { animation: pulse 8s ease-in-out infinite; transform-origin: center; }
        .blob-2 { animation: pulse 10s ease-in-out infinite 2s; transform-origin: center; }
        .blob-3 { animation: pulse 9s ease-in-out infinite 1s; transform-origin: center; }
        .line-dash { stroke-dasharray: 6 6; stroke-dashoffset: 100; animation: draw 4s linear infinite; }
    </style>

    <!-- Base Background -->
    <rect width="600" height="300" rx="24" fill="#F8FAFC"/>
    
    <!-- Soft Gradients/Blobs -->
    <circle class="blob-1" cx="100" cy="50" r="150" fill="#E0E7FF" filter="blur(40px)"/>
    <circle class="blob-2" cx="500" cy="200" r="120" fill="#FCE7F3" filter="blur(40px)"/>
    <circle class="blob-3" cx="300" cy="250" r="100" fill="#D1FAE5" filter="blur(30px)"/>

    <!-- Left UI Elements (Dashboard summary) -->
    <!-- Glassmorphic Card -->
    <g filter="drop-shadow(0px 10px 15px rgba(0, 0, 0, 0.05))">
        <rect x="40" y="40" width="220" height="130" rx="16" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Header text -->
        <rect x="60" y="60" width="80" height="12" rx="6" fill="#94A3B8" fill-opacity="0.4"/>
        <rect x="60" y="80" width="120" height="8" rx="4" fill="#CBD5E1" fill-opacity="0.4"/>
        
        <!-- Mini Stats -->
        <g>
            <circle cx="75" cy="120" r="15" fill="#818CF8" fill-opacity="0.2"/>
            <path d="M70 120 L74 124 L80 116" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="100" y="116" width="60" height="8" rx="4" fill="#94A3B8" fill-opacity="0.4"/>
        </g>

        <g>
            <circle cx="75" cy="160" r="15" fill="#34D399" fill-opacity="0.2"/>
            <path d="M75 152 V168 M67 160 H83" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
            <rect x="100" y="156" width="80" height="8" rx="4" fill="#94A3B8" fill-opacity="0.4"/>
        </g>
    </g>

    <!-- Right Task Cards (Floating effect) -->
    <g transform="translate(320, 30)">
        <!-- Task Card 1 -->
        <g class="card-1" filter="drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.04))">
            <rect x="0" y="0" width="240" height="60" rx="12" fill="white" stroke="#F1F5F9" stroke-width="1"/>
            <circle cx="20" cy="30" r="8" fill="#F43F5E" fill-opacity="0.2"/>
            <circle cx="20" cy="30" r="4" fill="#F43F5E"/>
            <rect x="40" y="20" width="100" height="8" rx="4" fill="#475569"/>
            <rect x="40" y="36" width="60" height="6" rx="3" fill="#94A3B8"/>
            <!-- Avatar mockup -->
            <circle cx="210" cy="30" r="10" fill="#E2E8F0"/>
        </g>

        <!-- Task Card 2 (In progress / Hover effect) -->
        <g class="card-2" filter="drop-shadow(0px 12px 20px rgba(99, 102, 241, 0.15))">
            <rect x="-20" y="80" width="260" height="68" rx="14" fill="white" stroke="#E0E7FF" stroke-width="2"/>
            <circle cx="20" cy="114" r="8" fill="#6366F1" fill-opacity="0.2"/>
            <circle cx="20" cy="114" r="4" fill="#6366F1"/>
            <rect x="40" y="104" width="140" height="8" rx="4" fill="#475569"/>
            <rect x="40" y="120" width="80" height="6" rx="3" fill="#818CF8"/>
            <!-- Progress bar -->
            <rect x="40" y="136" width="180" height="4" rx="2" fill="#F1F5F9"/>
            <rect x="40" y="136" width="120" height="4" rx="2" fill="#6366F1"/>
        </g>

        <!-- Task Card 3 -->
        <g class="card-3" filter="drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.04))">
            <rect x="20" y="168" width="220" height="60" rx="12" fill="white" stroke="#F1F5F9" stroke-width="1"/>
            <circle cx="40" cy="198" r="8" fill="#34D399" fill-opacity="0.2"/>
            <circle cx="40" cy="198" r="4" fill="#34D399"/>
            <rect x="60" y="188" width="120" height="8" rx="4" fill="#475569"/>
            <rect x="60" y="204" width="50" height="6" rx="3" fill="#94A3B8"/>
        </g>
    </g>

    <!-- Bottom Left Add Button -->
    <g filter="drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.05))">
        <circle cx="90" cy="230" r="24" fill="#6366F1">
            <animate attributeName="r" values="24;26;24" dur="2s" repeatCount="indefinite"/>
        </circle>
        <g>
            <animateTransform attributeName="transform" type="rotate" values="0 90 230; 90 90 230; 0 90 230" dur="6s" repeatCount="indefinite" />
            <path d="M90 215 V245 M75 230 H105" stroke="white" stroke-width="3" stroke-linecap="round"/>
        </g>
    </g>
    
    <!-- Abstract connecting lines -->
    <path class="line-dash" d="M140 160 Q200 220 300 130" stroke="#CBD5E1" stroke-width="2" fill="none"/>
</svg>
