<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes lift {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
        .anim-lift { animation: lift 3s ease-in-out infinite; transform-origin: center; }
        .anim-pulse { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle class="anim-pulse" cx="100" cy="80" r="100" fill="#FEE2E2" filter="blur(30px)"/>
    <circle class="anim-pulse" cx="300" cy="220" r="120" fill="#E0E7FF" filter="blur(40px)" style="animation-delay: 2s;"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="100" y="50" width="200" height="200" rx="24" fill="white" fill-opacity="0.8" stroke="white" stroke-width="2"/>
        
        <!-- Dumbbell (Lifting animation) -->
        <g transform="translate(140, 100)">
        <g class="anim-lift">
            <rect x="10" y="35" width="100" height="10" rx="4" fill="#64748B"/>
            <rect x="0" y="20" width="20" height="40" rx="6" fill="#F43F5E"/>
            <rect x="100" y="20" width="20" height="40" rx="6" fill="#F43F5E"/>
            <rect x="-10" y="10" width="15" height="60" rx="4" fill="#FB7185"/>
            <rect x="115" y="10" width="15" height="60" rx="4" fill="#FB7185"/>
        </g></g>

        <!-- Smartwatch Timer -->
        <g transform="translate(170, 170)">
            <rect x="10" y="0" width="40" height="40" rx="12" fill="#3B82F6" fill-opacity="0.2"/>
            <rect x="10" y="0" width="40" height="40" rx="12" fill="none" stroke="#3B82F6" stroke-width="3"/>
            <circle cx="30" cy="20" r="10" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-dasharray="2 4"/>
            <path d="M30 12 V20 L35 25" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
        </g>
    </g>
</svg>
