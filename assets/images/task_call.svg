<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes ring {
            0%, 100% { transform: scale(1); opacity: 0; }
            10% { opacity: 1; }
            50% { transform: scale(2); opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
        .anim-ring { animation: ring 3s linear infinite; transform-origin: center; fill: none; stroke: #34D399; stroke-width: 4; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle cx="200" cy="150" r="100" fill="#D1FAE5" filter="blur(30px)"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="120" y="50" width="160" height="200" rx="40" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Phone Outline -->
        <rect x="135" y="65" width="130" height="170" rx="24" fill="white" stroke="#94A3B8" stroke-width="6"/>
        <line x1="180" y1="75" x2="220" y2="75" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>

        <!-- Caller Info / Icon -->
        <g transform="translate(180, 110)">
            <circle cx="20" cy="20" r="24" fill="#A7F3D0"/>
            <path d="M12 25 L16 12 L20 20 L24 10 L28 25 M12 25 H28" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        
        <!-- Call Action Buttons -->
        <circle cx="165" cy="200" r="16" fill="#EF4444"/>
        <path d="M158 200 Q 165 190 172 200" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
        
        <circle cx="235" cy="200" r="16" fill="#10B981"/>
        <g transform="translate(235, 200)">
            <circle class="anim-ring" r="16"/>
            <circle class="anim-ring" r="16" style="animation-delay: 1.5s;"/>
            <path d="M-8 0 Q 0 10 8 0" stroke="white" stroke-width="3" stroke-linecap="round" fill="none"/>
        </g>
    </g>
</svg>
