<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 0.9; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }
        .anim-wave { animation: wave 8s linear infinite; }
        .anim-breathe { animation: breathe 6s ease-in-out infinite; transform-origin: center; }
        .anim-float { animation: float 7s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Breath Circle (Meditation) -->
    <circle cx="200" cy="130" r="100" fill="#A7F3D0" filter="blur(30px)" class="anim-breathe"/>
    <circle cx="200" cy="130" r="60" fill="#34D399" filter="blur(10px)" opacity="0.4"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="80" y="50" width="240" height="200" rx="24" fill="white" fill-opacity="0.85" stroke="white" stroke-width="2"/>
        
        <!-- Lotus/Mind Icon -->
        <g transform="translate(160, 80)">
            <path d="M40 80 C40 80 0 70 20 40 C40 10 40 40 40 40" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
            <path d="M40 80 C40 80 80 70 60 40 C40 10 40 40 40 40" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
            <path d="M40 80 C40 80 20 20 40 0 C60 20 40 80 40 80" fill="#A7F3D0" stroke="#10B981" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="40" cy="-20" r="8" fill="#FBBF24"/>
        </g>

        <!-- Wave Pattern -->
        <g transform="translate(50, 200)" clip-path="url(#wave-clip)">
            <clipPath id="wave-clip"><rect x="0" y="0" width="140" height="40" rx="10"/></clipPath>
            <path class="anim-wave" d="M0 20 Q 25 0 50 20 T 100 20 T 150 20 T 200 20 T 250 20" fill="none" stroke="#6EE7B7" stroke-width="4" stroke-linecap="round"/>
            <path class="anim-wave" d="M0 10 Q 25 -10 50 10 T 100 10 T 150 10 T 200 10 T 250 10" fill="none" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" style="animation-delay:-2s"/>
        </g>
    </g>
</svg>
