<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(-5deg); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
        .anim-breathe { animation: breathe 6s ease-in-out infinite; transform-origin: center; }
        .anim-twinkle { animation: twinkle 3s ease-in-out infinite; transform-origin: center; }
        .anim-float { animation: float 10s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#0F172A"/>
    
    <!-- Blobs (Night sky) -->
    <circle cx="200" cy="150" r="140" fill="#1E3A8A" filter="blur(40px)" opacity="0.6"/>

    <!-- Stars -->
    <g fill="#FEF08A">
        <circle cx="80" cy="80" r="3" class="anim-twinkle" style="animation-delay: 0s;"/>
        <circle cx="120" cy="220" r="2" class="anim-twinkle" style="animation-delay: 1s;"/>
        <circle cx="300" cy="100" r="4" class="anim-twinkle" style="animation-delay: 0.5s;"/>
        <circle cx="280" cy="240" r="3" class="anim-twinkle" style="animation-delay: 1.5s;"/>
        
        <path d="M80 75 V85 M75 80 H85" stroke="#FEF08A" stroke-width="2" class="anim-twinkle" style="animation-delay: 0s;"/>
        <path d="M300 95 V105 M295 100 H305" stroke="#FEF08A" stroke-width="2" class="anim-twinkle" style="animation-delay: 0.5s;"/>
    </g>

    <!-- Moon -->
    <g class="anim-float" filter="drop-shadow(0px 0px 30px rgba(253,230,138,0.4))">
        <path d="M220 100 C200 100 180 120 180 150 C180 180 200 200 220 200 C150 200 140 100 220 100 Z" fill="#FDE68A" class="anim-breathe"/>
    </g>

    <!-- Zzz -->
    <text x="240" y="110" font-family="sans-serif" font-weight="bold" font-size="24" fill="#E2E8F0" class="anim-float" style="animation-delay: 1s; animation-duration: 4s;">Z</text>
    <text x="260" y="80" font-family="sans-serif" font-weight="bold" font-size="18" fill="#CBD5E1" class="anim-float" style="animation-delay: 2s; animation-duration: 4s;">z</text>
    <text x="275" y="60" font-family="sans-serif" font-weight="bold" font-size="14" fill="#94A3B8" class="anim-float" style="animation-delay: 3s; animation-duration: 4s;">z</text>
</svg>
