<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        @keyframes coin {
            0% { transform: translateY(-40px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; transform: translateY(20px); }
            100% { opacity: 0; transform: translateY(40px); }
        }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
        .anim-coin1 { animation: coin 4s ease-in infinite; transform-origin: center; }
        .anim-coin2 { animation: coin 4s ease-in infinite 2s; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle cx="200" cy="150" r="140" fill="#DCFCE7" filter="blur(40px)"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="100" y="50" width="200" height="200" rx="30" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Dropping Coins -->
        <g transform="translate(160, 40)">
        <g class="anim-coin1">
            <circle cx="20" cy="20" r="15" fill="#FDE047" stroke="#F59E0B" stroke-width="3"/>
            <text x="20" y="26" font-family="sans-serif" font-weight="bold" font-size="16" fill="#D97706" text-anchor="middle">$</text>
        </g></g>
        <g transform="translate(200, 30)">
        <g class="anim-coin2">
            <circle cx="20" cy="20" r="15" fill="#FDE047" stroke="#F59E0B" stroke-width="3"/>
            <text x="20" y="26" font-family="sans-serif" font-weight="bold" font-size="16" fill="#D97706" text-anchor="middle">$</text>
        </g></g>

        <!-- Wallet -->
        <g transform="translate(130, 120)">
            <path d="M0 20 C0 10 10 0 20 0 H120 C130 0 140 10 140 20 V80 C140 90 130 100 120 100 H20 C10 100 0 90 0 80 Z" fill="#6B7280"/>
            <path d="M0 20 C0 10 10 0 20 0 H120 C130 0 140 10 140 20 V60 C140 70 130 80 120 80 H20 C10 80 0 70 0 60 Z" fill="#4B5563"/>
            <path d="M100 30 H140 V70 H100 C90 70 80 60 80 50 C80 40 90 30 100 30 Z" fill="#374151" stroke="#94A3B8" stroke-width="2"/>
            <circle cx="115" cy="50" r="6" fill="#E2E8F0"/>
            
            <!-- Cash sticking out -->
            <rect x="20" y="10" width="60" height="20" fill="#10B981" stroke="#059669" stroke-width="2"/>
            <circle cx="50" cy="20" r="6" fill="#059669"/>
        </g>
    </g>
</svg>
