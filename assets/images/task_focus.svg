<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes tunnel {
            0% { transform: scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes sand {
            from { height: 40px; y: 40px; }
            to { height: 0px; y: 80px; }
        }
        @keyframes sandBottom {
            from { height: 0px; y: 120px; }
            to { height: 40px; y: 80px; }
        }
        .anim-tunnel { animation: tunnel 4s linear infinite; transform-origin: center; fill: none; stroke: #818CF8; stroke-width: 2; opacity: 0; }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
        .anim-sand { animation: sand 10s linear infinite; fill: #FCD34D; }
        .anim-sand-bottom { animation: sandBottom 10s linear infinite; fill: #FCD34D; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Focus Tunnel Effect -->
    <circle cx="200" cy="150" r="80" class="anim-tunnel" style="animation-delay: 0s;"/>
    <circle cx="200" cy="150" r="80" class="anim-tunnel" style="animation-delay: 1.3s;"/>
    <circle cx="200" cy="150" r="80" class="anim-tunnel" style="animation-delay: 2.6s;"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="120" y="50" width="160" height="200" rx="24" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Hourglass -->
        <g transform="translate(160, 80)">
            <path d="M10 0 H70 M10 140 H70" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
            <path d="M20 0 L20 40 L35 65 L40 70 L45 65 L60 40 L60 0" fill="#E2E8F0" fill-opacity="0.5" stroke="#CBD5E1" stroke-width="2"/>
            <path d="M20 140 L20 100 L35 75 L40 70 L45 75 L60 100 L60 140" fill="#E2E8F0" fill-opacity="0.5" stroke="#CBD5E1" stroke-width="2"/>
            
            <!-- Sand Top -->
            <rect x="25" width="30" class="anim-sand"/>
            <!-- Sand Bottom -->
            <rect x="25" width="30" class="anim-sand-bottom"/>
            <!-- Sand Stream -->
            <rect x="38" y="70" width="4" height="40" fill="#FCD34D"/>
        </g>
    </g>
</svg>
