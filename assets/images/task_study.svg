<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        @keyframes page {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(0.8); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .anim-float { animation: float 7s ease-in-out infinite; transform-origin: center; }
        .anim-page { animation: page 4s ease-in-out infinite; transform-origin: left; }
        .anim-pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle class="anim-pulse" cx="120" cy="180" r="120" fill="#FEF3C7" filter="blur(40px)"/>
    <circle class="anim-pulse" cx="280" cy="100" r="100" fill="#E0F2FE" filter="blur(30px)" style="animation-delay: 3s;"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="80" y="60" width="240" height="180" rx="24" fill="white" fill-opacity="0.85" stroke="white" stroke-width="2"/>
        
        <!-- Laptop -->
        <g transform="translate(130, 100)">
            <rect x="10" y="10" width="120" height="70" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
            <rect class="anim-pulse" x="20" y="20" width="100" height="50" rx="4" fill="#38BDF8" fill-opacity="0.2"/>
            <rect x="-10" y="80" width="160" height="10" rx="5" fill="#64748B"/>
        </g>

        <!-- Book -->
        <g transform="translate(100, 150)">
            <rect x="10" y="10" width="60" height="40" rx="4" fill="#FCD34D"/>
            <rect class="anim-page" x="40" y="10" width="30" height="40" rx="2" fill="#FDE68A"/>
            <path d="M 15 20 H 30 M 15 30 H 25" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
        </g>
    </g>
</svg>
