<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes cloud {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(20px); }
        }
        @keyframes fly {
            0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
            50% { transform: translate(10px, -10px) rotate(5deg); }
        }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
        .anim-cloud { animation: cloud 12s ease-in-out infinite; }
        .anim-fly { animation: fly 4s ease-in-out infinite; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle cx="200" cy="150" r="140" fill="#E0F2FE" filter="blur(40px)"/>

    <!-- Clouds -->
    <g class="anim-cloud" fill="#FFFFFF" fill-opacity="0.8">
        <circle cx="80" cy="80" r="20"/>
        <circle cx="110" cy="70" r="30"/>
        <circle cx="140" cy="85" r="20"/>
        <rect x="80" y="80" width="60" height="25" rx="12"/>
    </g>

    <g class="anim-cloud" style="animation-duration: 15s; animation-direction: reverse;" fill="#FFFFFF" fill-opacity="0.6">
        <circle cx="280" cy="220" r="15"/>
        <circle cx="300" cy="210" r="25"/>
        <circle cx="320" cy="225" r="15"/>
        <rect x="280" y="215" width="40" height="25" rx="12"/>
    </g>

    <!-- Central Glass Card (Suitcase) -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <!-- Handle -->
        <path d="M170 100 V70 Q170 60 180 60 H220 Q230 60 230 70 V100" fill="none" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
        
        <!-- Case -->
        <rect x="140" y="100" width="120" height="140" rx="16" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        <rect x="150" y="110" width="100" height="120" rx="12" fill="#38BDF8"/>
        
        <!-- Details -->
        <rect x="180" y="110" width="40" height="120" fill="#0284C7" fill-opacity="0.2"/>
        <rect x="150" y="150" width="100" height="10" fill="#0EA5E9"/>
        <rect x="150" y="200" width="100" height="10" fill="#0EA5E9"/>
        
        <!-- Locks -->
        <rect x="160" y="90" width="15" height="10" rx="2" fill="#CBD5E1"/>
        <rect x="225" y="90" width="15" height="10" rx="2" fill="#CBD5E1"/>
        
        <!-- Airplane (Flying near bag) -->
        <g transform="translate(250, 40)">
        <g class="anim-fly">
            <path d="M0 30 L40 10 L50 15 L35 30 L45 45 L20 40 L0 50 Z" fill="#F43F5E"/>
            <path d="M20 40 L35 60 L45 45 Z" fill="#E11D48"/>
            <path d="M15 25 L25 10 L30 20 Z" fill="#FB7185"/>
        </g></g>
    </g>
</svg>
