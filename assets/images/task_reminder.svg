<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes ring {
            0%, 100% { transform: rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: rotate(10deg); }
            20%, 40%, 60%, 80% { transform: rotate(-10deg); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes glow {
            0%, 100% { fill-opacity: 0.1; }
            50% { fill-opacity: 0.3; }
        }
        .anim-ring { animation: ring 4s ease-in-out infinite; transform-origin: center top; }
        .anim-float { animation: float 7s ease-in-out infinite; transform-origin: center; }
        .anim-glow { animation: glow 2s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle cx="200" cy="150" r="130" fill="#FEF08A" filter="blur(50px)"/>
    <circle cx="200" cy="150" r="60" fill="#FDE047" filter="blur(20px)" class="anim-glow"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="120" y="50" width="160" height="200" rx="30" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Bell -->
        <g transform="translate(160, 100)">
        <g class="anim-ring">
            <path d="M40 0 C20 0 10 20 10 40 V50 C5 50 0 55 0 60 H80 C80 55 75 50 70 50 V40 C70 20 60 0 40 0 Z" fill="#F59E0B"/>
            <path d="M50 65 C50 70 45 75 40 75 C35 75 30 70 30 65 H50 Z" fill="#D97706"/>
        </g></g>

        <!-- Floating Notification Card -->
        <g class="anim-float" style="animation-duration: 4s; animation-delay: 1s;" filter="drop-shadow(0px 5px 10px rgba(0,0,0,0.1))">
            <rect x="70" y="160" width="100" height="30" rx="10" fill="white"/>
            <circle cx="85" cy="175" r="5" fill="#EF4444"/>
            <rect x="100" y="171" width="50" height="8" rx="4" fill="#E2E8F0"/>
        </g>
    </g>
</svg>
