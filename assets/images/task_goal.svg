<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes fill-bar {
            0% { width: 0; }
            50%, 100% { width: 140px; }
        }
        @keyframes pop {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        .anim-fill { animation: fill-bar 3s ease-in-out infinite; }
        .anim-pop { animation: pop 2s ease-in-out infinite; transform-origin: center; }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle cx="150" cy="200" r="100" fill="#E0E7FF" filter="blur(30px)"/>
    <circle cx="280" cy="120" r="80" fill="#FEF3C7" filter="blur(30px)"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="100" y="50" width="200" height="200" rx="24" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Mountains (Goals) -->
        <g transform="translate(140, 90)">
            <path d="M0 80 L30 30 L50 60 L80 10 L120 80 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="4" stroke-linejoin="round"/>
            <path d="M80 10 L65 30 L85 40 L95 25 Z" fill="white"/>
            <path d="M30 30 L20 45 L35 50 L40 45 Z" fill="white"/>
            
            <!-- Flag -->
            <path d="M80 10 L80 -20" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
            <path class="anim-pop" d="M80 -20 L110 -10 L80 0 Z" fill="#F43F5E"/>
        </g>
        
        <!-- Progress Bar -->
        <g transform="translate(130, 200)">
            <rect x="0" y="0" width="140" height="12" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <rect x="0" y="0" width="140" height="12" rx="6" fill="#8B5CF6" class="anim-fill"/>
        </g>
    </g>
</svg>
