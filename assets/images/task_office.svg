<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes chat {
            0%, 100% { opacity: 0; transform: scale(0.8) translateY(10px); }
            10%, 90% { opacity: 1; transform: scale(1) translateY(0px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        .anim-float { animation: float 6s ease-in-out infinite; transform-origin: center; }
        .anim-chat { animation: chat 5s ease-in-out infinite; transform-origin: bottom left; }
        .anim-pulse { animation: pulse 6s ease-in-out infinite; transform-origin: center; }
    </style>

    <!-- Background -->
    <rect width="400" height="300" rx="20" fill="#F8FAFC"/>
    
    <!-- Blobs -->
    <circle class="anim-pulse" cx="200" cy="150" r="140" fill="#E0E7FF" filter="blur(45px)"/>

    <!-- Central Glass Card -->
    <g class="anim-float" filter="drop-shadow(0px 10px 20px rgba(0,0,0,0.05))">
        <rect x="90" y="50" width="220" height="200" rx="24" fill="white" fill-opacity="0.9" stroke="white" stroke-width="2"/>
        
        <!-- Briefcase -->
        <g transform="translate(130, 110)">
            <rect x="35" y="0" width="50" height="20" rx="4" fill="none" stroke="#64748B" stroke-width="4"/>
            <rect x="10" y="20" width="100" height="60" rx="8" fill="#4F46E5"/>
            <rect x="10" y="20" width="100" height="20" fill="white" fill-opacity="0.2"/>
            <circle cx="60" cy="50" r="8" fill="#FBBF24"/>
        </g>

        <!-- Notification Bell (Chat bubble) -->
        <g transform="translate(220, 80)">
        <g class="anim-chat">
            <path d="M0 20 C0 8.954 8.954 0 20 0 H40 C51.046 0 60 8.954 60 20 C60 31.046 51.046 40 40 40 H10 L0 50 V20 Z" fill="#F43F5E"/>
            <circle cx="20" cy="20" r="3" fill="white"/>
            <circle cx="30" cy="20" r="3" fill="white"/>
            <circle cx="40" cy="20" r="3" fill="white"/>
        </g></g>
    </g>
</svg>
